<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Ticket</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="eventform.css">
    <script src="eventform.js" defer></script>
</head>
<body>
    <main>
        <h1>Event Ticket</h1>
        <form id="ticket-form" novalidate>
            <div class="field">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="firstName" required minlength="2" maxlength="30">
                <span class="field-error" id="first-name-error"></span>
            </div>
            <div class="field">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="lastName" required minlength="2" maxlength="30">
                <span class="field-error" id="last-name-error"></span>
            </div>
            <div class="field full">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <span class="field-error" id="email-error"></span>
            </div>
            <div class="field">
                <label for="type">Type</label>
                <select id="type" name="type" required>
                    <option value="">Choose one</option>
                    <option value="student">Student</option>
                    <option value="guest">Guest</option>
                </select>
                <span class="field-error" id="type-error"></span>
            </div>
            <div class="field">
                <label for="event-date">Event Date</label>
                <input type="date" id="event-date" name="eventDate" required>
                <span class="field-error" id="event-date-error"></span>
            </div>
            <div class="field full hide" id="code-box">
                <label for="code" id="code-label">Student I#</label>
                <input type="text" id="code" name="code">
                <span class="field-error" id="code-error"></span>
            </div>
            <button type="submit" class="full">Create Ticket</button>
        </form>
        <div id="errors"></div>
        <div id="ticket"></div>
    </main>
</body>
</html>

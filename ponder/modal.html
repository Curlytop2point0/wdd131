<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WDD 131 W04 ponder: a responsive image gallery that opens a full-size image in a dialog modal.">
  <meta name="author" content="Maxim Person">
  <title>Modals</title>
  <link href="modal.css" rel="stylesheet">
  <script defer src="modal.js"></script>
</head>
<body>
  <h1>Gallery</h1>
  <section class="gallery">
    <figure>
      <img src="images/book-sm.jpg" alt="person reading a book">
    </figure>
    <figure>
      <img src="images/couch-sm.jpg" alt="person sitting on a couch with a phone">
    </figure>
    <figure>
      <img src="images/desk-sm.jpg" alt="a work desktop">
    </figure>
    <figure>
      <img src="images/keyboard-sm.jpg" alt="person typing on a keyboard">
    </figure>
    <figure>
      <img src="images/phone-sm.jpg" alt="person looking at a phone">
    </figure>
    <figure>
      <img src="images/sit-sm.jpg" alt="person sitting on a couch">
    </figure>
  </section>
  <dialog>
    <img>
    <button class="close-viewer">X</button>
  </dialog>
  <!--
    AI Disclosure: The code in this file was written by Maxim Person with minor assistance from AI.
    1. Markup guidance from AI, Grok Bot, October 7, 2026.
  -->
</body>
</html>
